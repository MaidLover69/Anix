name: Dependency audit

# Weekly check of the Rust and npm dependencies against the public advisory databases
# (CONSTRAINTS.md › External checks). Also runs when the lock files change.
on:
  schedule:
    - cron: '17 4 * * 1'
  push:
    paths:
      - 'src-tauri/Cargo.lock'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Rust advisories
        run: cargo audit --file src-tauri/Cargo.lock

      - name: npm advisories (shipped packages only)
        run: npm audit --omit=dev --audit-level=high
