name: Smoke the AppImage

# The built AppImage on clean systems under X (Xvfb + a window manager), with real clicks and keys.
# Only the base whose WebKitWebDriver matches the WebKit the AppImage bundles (webdriver_base) also
# plays a local clip through the stream proxy and checks fullscreen (scripts/smoke-appimage.py).
# Called by release.yml after the build; run it by hand with the id of a finished release run to test
# that run's AppImage again without building it.
on:
  workflow_call:
    inputs:
      run_id:
        type: string
        default: ''
      artifact:
        type: string
        default: anix-appimage
      bases:
        type: string
        default: '["ubuntu:22.04", "ubuntu:24.04", "debian:12", "fedora:latest", "archlinux:latest"]'
      webdriver_base:
        type: string
        default: 'ubuntu:22.04'
  workflow_dispatch:
    inputs:
      run_id:
        description: Id of a release run whose AppImage to test
        required: true
      artifact:
        description: anix-appimage (classic) or anix-appimage-modern (newer systems)
        default: anix-appimage
      bases:
        description: Distributions to test on, as a JSON list
        default: '["ubuntu:22.04", "ubuntu:24.04", "debian:12", "fedora:latest", "archlinux:latest"]'
      webdriver_base:
        description: The one whose WebKitWebDriver matches the bundled WebKit
        default: 'ubuntu:22.04'

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  smoke:
    name: Smoke the AppImage on ${{ matrix.base }}
    runs-on: ubuntu-latest
    container: ${{ matrix.base }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        base: ${{ fromJSON(inputs.bases) }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install a display, a window manager, xdotool and a desktop's GTK and Mesa (no libfuse2)
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends xvfb xdotool openbox dbus-x11 imagemagick python3 binutils ca-certificates
            # What every desktop has: GTK 3 (it brings the Wayland client libraries the AppImage leaves to the
            # system) and Mesa (GBM brings libwayland-server). Bare containers lack them; without them the AppImage cannot start.
            apt-get install -y -qq --no-install-recommends libgtk-3-0t64 2>/dev/null || apt-get install -y -qq --no-install-recommends libgtk-3-0
            # libgpg-error comes with systemd (libgcrypt) on every desktop; the AppImage leaves it to the system.
            apt-get install -y -qq --no-install-recommends libgl1-mesa-dri libegl1 libgbm1 libwayland-server0 libgpg-error0
            if [ "${{ matrix.base }}" = "${{ inputs.webdriver_base }}" ]; then apt-get install -y -qq --no-install-recommends webkit2gtk-driver ffmpeg; fi
          elif command -v dnf >/dev/null; then
            dnf install -y -q xorg-x11-server-Xvfb xdotool openbox dbus-x11 ImageMagick python3 binutils gtk3 mesa-dri-drivers mesa-libEGL mesa-libgbm libwayland-server
          else
            pacman -Syu --noconfirm --quiet xorg-server-xvfb xdotool openbox dbus imagemagick python binutils gtk3 mesa
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download the AppImage built in this run
        if: inputs.run_id == ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: dist

      - name: Download the AppImage of an earlier release run
        if: inputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: dist
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Run the smoke test
        run: |
          chmod +x dist/*.AppImage
          extra=""
          if command -v WebKitWebDriver >/dev/null || [ -x /usr/bin/WebKitWebDriver ]; then
            ffmpeg -loglevel error -f lavfi -i testsrc=size=1280x720:rate=30 -f lavfi -i sine=frequency=440 \
              -t 60 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest clip.mp4
            extra="--webdriver --clip $PWD/clip.mp4"
          fi
          Xvfb :99 -screen 0 1280x800x24 -nolisten tcp & export DISPLAY=:99; sleep 2
          openbox & sleep 2
          dbus-run-session -- python3 scripts/smoke-appimage.py dist/*.AppImage smoke-out $extra

      - name: Upload the smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ inputs.artifact }}-${{ strategy.job-index }}
          path: smoke-out/
          retention-days: 14
          if-no-files-found: ignore
