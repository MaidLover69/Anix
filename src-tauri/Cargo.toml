[package]
name = "anilili-linux"
version = "1.0.3"
description = "Anilili - Modern Anime Streaming & Library Desktop App for Linux"
authors = ["Anilili Team"]
license = "MIT"
edition = "2021"

[lib]
name = "anilili_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.2", features = ["devtools"] }
tauri-plugin-shell = "2.2"
tauri-plugin-dialog = "2.2"
tauri-plugin-deep-link = "2"
notify-rust = "4"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "gzip", "brotli"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
moka = { version = "0.12", features = ["future"] }
regex = "1.10"
once_cell = "1.19"
thiserror = "1.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2.5"
base64 = "0.22"
encoding_rs = "0.8"
libc = "0.2"
dirs = "5.0"
tiny_http = "0.12"
flate2 = "1.0"
urlencoding = "2.1"
rquickjs = "0.14"
scraper = "0.27"
ego-tree = "0.11"
oxc_allocator = "0.153"
oxc_parser = "0.153"
oxc_semantic = "0.153"
oxc_span = "0.153"
oxc_transformer = "0.153"
oxc_codegen = "0.153"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"

[profile.release]
strip = true
lto = "thin"
