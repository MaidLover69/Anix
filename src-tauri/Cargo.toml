[package]
name = "anix"
version = "1.3.2"
description = "Anix - anime catalogue, tracker, library and player for Linux"
authors = ["Anix"]
license = "MIT"
edition = "2021"

[lib]
name = "anix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.2", features = ["devtools", "tray-icon"] }
tauri-plugin-shell = "2.2"
tauri-plugin-dialog = "2.2"
tauri-plugin-deep-link = "2"
notify-rust = "4"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "gzip", "brotli"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
moka = { version = "0.12", features = ["future"] }
regex = "1.10"
once_cell = "1.19"
thiserror = "1.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2.5"
base64 = "0.22"
encoding_rs = "0.8"
libc = "0.2"
dirs = "5.0"
tiny_http = "0.12"
flate2 = "1.0"
urlencoding = "2.1"
rquickjs = "0.14"
scraper = "0.27"
ego-tree = "0.11"
oxc_allocator = "0.153"
oxc_parser = "0.153"
oxc_semantic = "0.153"
oxc_span = "0.153"
oxc_transformer = "0.153"
oxc_codegen = "0.153"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
zbus = "5"
anitomy-ng = "1.0.10"

[target.'cfg(target_os = "linux")'.dependencies]
# Already part of Tauri's tree; used to place the embedded mpv GL area under the webview.
gtk = "0.18"

[dev-dependencies]
futures-util = "0.3"
# Paused test clock, so budgets of tens of seconds are tested without waiting for them.
tokio = { version = "1.38", features = ["test-util"] }

[profile.release]
strip = true
lto = "thin"
